name: temanbule

x-application: &application
  image: ${APP_IMAGE:?Set APP_IMAGE in .env.deploy}
  build:
    context: .
    args:
      PYTHON_IMAGE: ${PYTHON_IMAGE:?Set reviewed PYTHON_IMAGE}
      UV_IMAGE: ${UV_IMAGE:?Set reviewed UV_IMAGE}
  env_file: .env
  init: true
  read_only: true
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=128m
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  networks: [data, egress]
  restart: "on-failure:5"
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    image: ${POSTGRES_IMAGE:?Set reviewed POSTGRES_IMAGE}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: ${REDIS_IMAGE:?Set reviewed REDIS_IMAGE}
    command: [redis-server, --appendonly, "yes", --appendfsync, everysec]
    volumes: [redis-data:/data]
    networks: [data]
    restart: unless-stopped
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 10s
      timeout: 5s
      retries: 5
  api:
    <<: *application
    profiles: [application]
    command: [python, -m, uvicorn, temanbule.api.main:app, --host, 0.0.0.0, --port, "8000"]
    ports: ["127.0.0.1:${API_HOST_PORT:?Set API_HOST_PORT}:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  worker:
    <<: *application
    profiles: [application]
    command: [python, -m, temanbule.worker.main]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  realtime-worker:
    <<: *application
    profiles: [realtime]
    command: [python, -m, temanbule.realtime.main]
    stop_grace_period: ${REALTIME_STOP_GRACE:?Set REALTIME_STOP_GRACE}
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  migrate:
    <<: *application
    profiles: [maintenance]
    restart: "no"
    command: [python, -m, alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}

networks:
  data:
    internal: true
  egress: {}
volumes:
  postgres-data: {}
  redis-data: {}
