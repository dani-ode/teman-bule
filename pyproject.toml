# Dependency source of truth remains requirements*.txt + generated hash locks.
# This repository is not packaged until the application foundation phase.
[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["custom_langflow_components"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires real infrastructure",
  "contract: verifies external interface fixtures",
  "e2e: complete application scenario",
  "live: explicit opt-in billable external integration",
]
