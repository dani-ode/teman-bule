name: Preparation checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  preparation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.8'
          python-version: '3.12'
      - run: make sync check
      - name: Audit runtime dependencies
        run: make audit
# Application lint/type/test/build becomes mandatory once Phase 1 creates src/tests.
# Production promotion also requires reviewed immutable action/image digests.
